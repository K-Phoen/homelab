apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synapse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true # When syncing changes, respect fields ignored by the ignoreDifferences configuration

  destination:
    namespace: synapse
    server: {{ .Values.spec.destination.server }}

  sources:
    - chart: matrix-synapse
      repoURL: https://ananace.gitlab.io/charts
      targetRevision: '3.12.36'
      helm:
        valueFiles:
          # Even when the ref field is configured with the path field, $value still represents the root of sources with the ref field.
          - $values/k8s/synapse/values.yaml
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      path: k8s/synapse
      ref: values
